# hard-bug-pack — "two opinions until convergence" for hard bugs, built entirely
# from native gascity mechanics (a fan-in DAG per round + a coordinator agent that
# drives the outer loop from its prompt). No new SDK primitives.
#
# The manual flow it automates: give TWO independent worker lanes the same hard
# bug; each produces a ROOT CAUSE + fix sketch; they act as each other's SECOND
# OPINION ("consider or refute — not a mandate") until root cause, then the fix,
# converge "close enough" (a subjective, coordinator-judged call); the stronger
# lane implements + tests + fixes; the other cross-reviews the diff AND its
# verification evidence. Bounded per-phase iteration; human escalation on cap/stuck.
#
# What it contributes (all discovered by directory convention — agents/, formulas/,
# assets/, commands/):
#
#   agents/hb-worker-a/        lane A (claude/opus): diagnose / reconsider / implement
#                           / cross-review, single slot, its OWN detached worktree.
#   agents/hb-worker-b/        lane B (claude/sonnet today): identical method (shares
#                           worker-a's prompt). ONE-LINE change to a real second
#                           vendor later: set provider="codex" via [[rigs.patches]].
#   agents/hb-coordinator/     the protocol driver (single slot): reads both lanes,
#                           makes the subjective convergence call, relays second
#                           opinions, enforces the cap, escalates to the human.
#   formulas/hard-bug-round.toml     one convergence round: two lanes + a
#                           coordinator reconcile step gated on BOTH (mol-review-
#                           quorum shape). Re-slung each round by the coordinator.
#   formulas/hard-bug-finalize.toml  implement -> cross-review -> finalize.
#   assets/scripts/emit-json.sh      schema-agnostic atomic finish: MERGE-write
#                           gc.output_json + set outcome + CLOSE (+ opt notify).
#   assets/scripts/worktree-setup.sh pre_start hook: one detached worktree per slot;
#                           refuses to run in the rig root (loud fail, no stomp).
#   commands/status/        `gc hard-bug-pack status <arc-bead>` — LLM-free render
#                           of the arc's hard-bug-state.v1 (phase/round/status).
#
# WHY THE OUTER LOOP LIVES IN THE COORDINATOR, NOT A FORMULA: `gc sling` is
# fire-and-forget (no --wait), and the formula system is a compile-time DAG with
# only single-step check/retry loops ([steps.loop].until is inert). So a round's
# two-lanes -> reconcile fan-in is a DAG (the controller gates + routes it, no
# polling), but the subjective, cross-round/cross-phase loop-back MUST be agent
# judgment in a prompt — which is exactly gascity's "keep judgment out of Go."
#
# Provider-agnostic: lanes are parameterized by target/provider/model (like
# mol-review-quorum). `gc.provider` in step metadata is a documentation/dashboard
# hint only — the RUNTIME provider comes from the agent config (worker-b.provider),
# so a second vendor is a config change, not a formula change.
#
# Isolation: a rig-scoped session with an empty work_dir resolves to the rig root,
# so every agent sets work_dir = ".gc/worktrees/{{.Rig}}/{{.AgentBase}}" +
# pre_start worktree-setup.sh — each single slot gets its own detached worktree.
#
# Attached via a rig's `includes` in city.toml (the Rig struct has NO `pack`
# field); all agents are rig-scoped (scope="rig"), so they expand once per rig.
# No [[named_session]] blocks: all three are POOL agents (min/max_active_sessions),
# auto-discovered from agents/ and materialized on demand when work is slung.

[pack]
name = "hard-bug-pack"
schema = 2
description = "Two independent worker lanes each diagnose a hard bug and act as each other's second opinion until root-cause then fix-plan converge (subjective, coordinator-judged); the stronger lane implements + tests, the other cross-reviews the diff and its evidence. Bounded per-phase iteration with human escalation. Provider-agnostic lanes (mol-review-quorum shape); coordinator-agent-driven outer loop."
