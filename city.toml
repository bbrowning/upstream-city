[[rigs.patches]]
agent = "pr-follow-up"
option_defaults = { model = "opus", effort = "high" }
env = { GC_PERSONAS = "/pvc/workspace/tools/vllm/personas" }

[[rigs.patches]]
agent = "pr-chat"
option_defaults = { model = "opus", effort = "high" }
