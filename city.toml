[workspace]
provider = "codex"
install_agent_hooks = ["codex"]

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
option_defaults = { model = "opus", effort = "high" }
options_schema_merge = "by_key"

[[providers.claude.options_schema]]
key = "model"
[[providers.claude.options_schema.choices]]
value = "claude-opus-5"
label = "Opus 5 (pinned id)"
flag_args = ["--model", "claude-opus-5"]

[providers.codex]
base = "builtin:codex"
option_defaults = { model = "gpt-5.6-luna", effort = "high" }

[[rigs]]
name = "paude"
prefix = "paude"
default_branch = "main"
includes = ["dev-pack"]

[[rigs.patches]]
agent = "pr-triage"
provider = "codex"
option_defaults = { model = "gpt-5.6-sol", effort = "medium" }

[[rigs.patches]]
agent = "pr-review-synthesizer"
provider = "codex"
option_defaults = { model = "gpt-5.6-sol", effort = "medium" }
env = { GC_PERSONAS = "/pvc/workspace/tools/paude/personas", GC_PERSONAS_REQUIRED = "true" }

[[rigs.patches]]
agent = "pr-arbiter"
provider = "codex"
option_defaults = { model = "gpt-5.6-sol", effort = "xhigh" }
env = { GC_PERSONAS = "/pvc/workspace/tools/paude/personas", GC_PERSONAS_REQUIRED = "true" }

[[rigs.patches]]
agent = "pr-runner"
provider = "codex"
option_defaults = { model = "gpt-5.6-luna", effort = "high" }
env = { UV_CACHE_DIR = "/pvc/workspace/.uv-cache", GC_PREPARE_TEST_ENV = "/pvc/workspace/tools/paude/paude-testenv.sh", GC_PERSONAS = "/pvc/workspace/tools/paude/personas" }

[[rigs.patches]]
agent = "pr-follow-up"
