[workspace]
provider = "claude"

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
option_defaults = {
  model = "opus",
  effort = "high",
}

[[rigs]]
name = "paude"
prefix = "paude"
default_branch = "main"

[[rigs]]
name = "vllm"
prefix = "vllm"
default_branch = "main"
includes = ["pr-review-pack", "hard-bug-pack"]   # in-city folders (PR review + two-opinion hard-bug)

  # Lane B of hard-bug-pack is provider-agnostic and the formula no longer pins its
  # model, so a real second vendor is a true one-liner: uncomment this patch (and add
  # a [providers.codex] block + creds); formulas/prompts unchanged.
  # [[rigs.patches]]
  # agent = "hb-worker-b"
  # provider = "codex"
  # option_defaults = { model = "gpt-5-codex" }

  # Per-agent model/effort (my choice, not the pack's). Triage is backstopped by
  # the deterministic prescan + reviewer re-derivation, so it stays lean; the
  # reviewer's verdict is what I act on, so it gets the deeper pass.
  [[rigs.patches]]
  agent = "triage"
  option_defaults = { model = "opus", effort = "high" }

  [[rigs.patches]]
  agent = "reviewer"
  option_defaults = { model = "opus", effort = "xhigh" }
  # Dynamic checks: lazily build/reuse a CPU vLLM test venv (vLLM-specific, kept out
  # of the generic pack). GC_PREPARE_TEST_ENV is the builder the gate runs only when
  # a trusted check actually executes; UV_CACHE_DIR stays on btrfs for reflinks.
  # GC_PR_PERSONAS is the vLLM review persona set (also vLLM-specific, kept out of the
  # generic pack); the reviewer always loads base.md and adds any persona whose
  # "Activates on:" header matches a changed path (see tools/vllm/review-personas/).
  # Injected as $GC_PR_PERSONAS.
  env = { UV_CACHE_DIR = "/pvc/workspace/.uv-cache", GC_PREPARE_TEST_ENV = "/pvc/workspace/tools/vllm/vllm-testenv.sh", GC_PR_PERSONAS = "/pvc/workspace/tools/vllm/review-personas" }

  # Human-approved dynamic-check lane. Same env wiring as the reviewer; the gate
  # (run-scoped-check.sh --min-ceiling limited) still floors it on the fresh ceiling.
  [[rigs.patches]]
  agent = "runner"
  option_defaults = { model = "opus", effort = "high" }
  env = { UV_CACHE_DIR = "/pvc/workspace/.uv-cache", GC_PREPARE_TEST_ENV = "/pvc/workspace/tools/vllm/vllm-testenv.sh" }

  # Hard-bug lanes: same prepared CPU test-venv wiring as the reviewer, so a lane that
  # needs to run vllm reuses the warm uv cache + the blessed CPU-only recipe
  # (tools/vllm/vllm-testenv.sh, ~seconds warm) instead of a full torch install from
  # scratch. (vLLM-specific env, kept out of the generic pack.)
  #
  # Per-worker model: uncomment option_defaults.model to control each lane's model
  # (valid claude: opus|sonnet|haiku|fable-5|opus-4-7|sonnet-5|sonnet-4-6). NB:
  # rig-patch option_defaults are NOT validated at `gc reload` — a typo here is caught
  # at launch (logged, falls back to default), not at reload.
  [[rigs.patches]]
  agent = "hb-worker-a"
  # option_defaults = { model = "opus" }
  env = { UV_CACHE_DIR = "/pvc/workspace/.uv-cache", GC_PREPARE_TEST_ENV = "/pvc/workspace/tools/vllm/vllm-testenv.sh" }

  [[rigs.patches]]
  agent = "hb-worker-b"
  # option_defaults = { model = "sonnet" }
  env = { UV_CACHE_DIR = "/pvc/workspace/.uv-cache", GC_PREPARE_TEST_ENV = "/pvc/workspace/tools/vllm/vllm-testenv.sh" }

[[rigs]]
name = "gascity"
prefix = "gascity"
default_branch = "main"

# One lead per rig, from a single template. scope="rig" + no dir fans this
# out to paude/lead, vllm/lead, gascity/lead. mode="on_demand" reserves the
# identity and materializes on dispatch; set mode="always" for always-awake.
[[named_session]]
name = "lead"
template = "lead"
scope = "rig"
mode = "on_demand"
