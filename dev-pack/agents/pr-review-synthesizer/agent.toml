# Review synthesizer/orchestrator — posture-gated review workflow target.
#
# On a `trusted` PR (deterministic ceiling == trusted) it may auto-run exactly ONE
# in-scope check on the changed code, via assets/scripts/run-scoped-check.sh (which
# re-derives the ceiling and refuses if it dropped). For every other posture it is
# fully read-only. Execution needs a prepared interpreter in $GC_PR_TEST_VENV
# (for vLLM, built by //tools/vllm/vllm-testenv.sh and wired via this rig's
# [[rigs.patches]] env); absent that, the check reports could_not_verify.
#
# On-demand and rig-scoped: a session spins up when a review formula or synthesis
# step is routed to it, and idles out afterward.
#
# Division of labor:
#   - prompt.template.md  → the reviewer's standing METHOD (how it reviews,
#                           the checklist, the read-only discipline).
#   - formulas/pr-review.toml → the per-run TASK (which diff) + the exact
#                           output contract it must emit.

scope = "rig"
nudge = "You have a review assignment. Run `gc prime`, read your bead, review the diff, dispose by posture (on a trusted PR auto-run one in-scope check via run-scoped-check.sh), write your pr-review.v1 verdict to gc.output_json, then close the step and notify the human."
idle_timeout = "30m"
min_active_sessions = 0
max_active_sessions = 2

# --- Per-slot worktree isolation (the fix for the shared-checkout bug) -------
# Without work_dir, a rig-scoped session resolves straight to the rig root
# (verified: internal/workdir/workdir.go:241-256), so scaling max_active_sessions
# past 1 would put every reviewer in the SAME checkout/HEAD. With this template,
# a bounded pool expands to pr-review-synthesizer-1 / pr-review-synthesizer-2 (SupportsInstanceExpansion is
# true when max_active_sessions > 1), each with a distinct {{.AgentBase}} → its
# own worktree. That is the paude-container guarantee, via native gascity.
work_dir = ".gc/worktrees/{{.Rig}}/{{.AgentBase}}"

# pre_start runs before the session starts, so the reviewer opens IN its worktree.
# It only creates the isolated (detached) worktree — it has NO per-bead context,
# so it does NOT fetch a specific PR; the reviewer does that itself (see prompt).
# The setup script is the SHARED spine copy at the CITY ROOT (tools/shared/), so
# {{.CityRoot}} is correct here — it resolves to the city root, which is exactly
# where the canonical script now lives. (A script that lived IN this pack would use
# {{.ConfigDir}} = the pack root; {{.CityRoot}} is right only because we moved the
# script to the city root to single-source it across every dev lane.)
pre_start = ["{{.CityRoot}}/tools/shared/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}}"]
