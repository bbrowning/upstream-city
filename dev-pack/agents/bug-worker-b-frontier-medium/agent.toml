# Semantic bug leaf for the frontier-medium execution role set.
# Concrete provider/model/effort are intentionally required from each rig's city patch.
scope = "rig"
nudge = "You have a bug lane assignment. Run `gc prime`, follow the step task and schema in your own worktree, finish with emit-json.sh, and never mutate a remote."
idle_timeout = "45m"
min_active_sessions = 0
max_active_sessions = 1
prompt_template = "agents/bug-worker-a/prompt.template.md"
work_dir = ".gc/worktrees/{{.Rig}}/{{.AgentBase}}"
pre_start = ["{{.CityRoot}}/tools/shared/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}}"]
