# pr-reviewer-a — Lane A of the review quorum (N>=2).
#
# Identical METHOD to pr-reviewer (it shares pr-reviewer's prompt template); it
# exists only so the two quorum lanes can run DIFFERENT models. Unlike a pooled
# agent (where a per-step opt_model does not reliably override option_defaults),
# distinct single-slot agents get a genuine cross-model split from their own
# option_defaults — the same way the bug lane's worker-a/worker-b differ. Model +
# env are set as a [[rigs.patches]] on this agent in city.toml so the pack stays
# project-agnostic (see also pr-reviewer/agent.toml, which keeps model out of the
# pack for the same reason).
#
# NB: this a/b split caps the review quorum at N=2. Generalizing to N>2 (and making
# a per-run opt_model model dial work on a pooled agent) is tracked as a follow-up.

scope = "rig"
nudge = "You have a review-quorum lane assignment. Run `gc prime`, read your bead, review the diff, dispose by posture (on a trusted PR auto-run one in-scope check via run-scoped-check.sh), write your pr-review.v1 verdict to gc.output_json, then close the step and notify the human."
idle_timeout = "30m"
min_active_sessions = 0
max_active_sessions = 1

# Share pr-reviewer's method (DRY). adjustFragmentPath resolves this against the
# pack root.
prompt_template = "agents/pr-reviewer/prompt.template.md"

# Its OWN detached worktree (single slot → stable {{.AgentBase}} → stable worktree),
# so lane A never shares a checkout/HEAD with lane B or the synthesis lane.
work_dir = ".gc/worktrees/{{.Rig}}/{{.AgentBase}}"
pre_start = ["{{.CityRoot}}/tools/shared/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}}"]
