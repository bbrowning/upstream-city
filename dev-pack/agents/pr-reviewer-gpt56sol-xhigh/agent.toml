# pr-reviewer-gpt56sol-xhigh — a review lane PROFILE (codex gpt-5.6-sol @ xhigh).
#
# A SECOND-VENDOR review lane: an OpenAI Codex agent, not Claude. Like the other
# reviewer profiles it is a single-slot agent that shares the review METHOD (same
# prompt template) and differs ONLY in the model/effort PINNED via its [[rigs.patches]]
# option_defaults in city.toml — plus `provider = "codex"` there. This one runs at xhigh
# (codex's TOP effort — there is no `max`), so it is the apples-to-apples counterpart to
# the Claude xhigh profiles: `--lanes opus48-xhigh,gpt56sol-xhigh` compares opus 4.8 vs
# gpt-5.6-sol at MATCHED effort. Single slot so its worktree/HEAD is stable; used SOLO it
# notifies the human, used as a quorum lane it is stamped gc.review_quorum_lane and stays
# silent (synthesis notifies once).

scope = "rig"
nudge = "You have a review lane assignment. Run `gc prime`, review by posture, then submit pr-review.v1 once through the schema-aware emit-review.py stdin command in your prompt; it validates, stores, closes, and notifies."
idle_timeout = "30m"
min_active_sessions = 0
max_active_sessions = 1

# Share the review method (DRY). adjustFragmentPath resolves this against the pack root.
prompt_template = "agents/pr-review-synthesizer/prompt.template.md"

# Its OWN detached worktree (single slot → stable {{.AgentBase}} → stable worktree).
work_dir = ".gc/worktrees/{{.Rig}}/{{.AgentBase}}"
pre_start = ["{{.CityRoot}}/tools/shared/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}}"]
