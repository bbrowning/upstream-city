# pr-reviewer-gpt56luna-xhigh — a review lane PROFILE (codex gpt-5.6-luna @ xhigh).
#
# A SECOND-VENDOR review lane: an OpenAI Codex agent, not Claude. Like the other
# reviewer profiles it is a single-slot agent that shares the review METHOD (same
# prompt template) and differs ONLY in the model/effort PINNED via its [[rigs.patches]]
# option_defaults in city.toml — plus `provider = "codex"` there. Model = gpt-5.6-luna
# (a sibling of gpt-5.6-sol) at xhigh (codex's TOP effort — there is no `max`). Reach it
# with `gc dev-pack review <PR> --lanes gpt56luna-xhigh` (solo) or pair it in a quorum,
# e.g. `--lanes opus48-xhigh,gpt56luna-xhigh` or `--lanes gpt56sol-xhigh,gpt56luna-xhigh`.
# Single slot so its worktree/HEAD is stable; used SOLO it notifies the human, used as a
# quorum lane it is stamped gc.review_quorum_lane and stays silent (synthesis notifies once).

scope = "rig"
nudge = "You have a review lane assignment. Run `gc prime`, read your bead, review the diff, dispose by posture (on a trusted PR auto-run one in-scope check via run-scoped-check.sh), write your pr-review.v1 verdict to gc.output_json, then close the step and notify the human."
idle_timeout = "30m"
min_active_sessions = 0
max_active_sessions = 1

# Share the review method (DRY). adjustFragmentPath resolves this against the pack root.
prompt_template = "agents/pr-review-synthesizer/prompt.template.md"

# Its OWN detached worktree (single slot → stable {{.AgentBase}} → stable worktree).
work_dir = ".gc/worktrees/{{.Rig}}/{{.AgentBase}}"
pre_start = ["{{.CityRoot}}/tools/shared/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}}"]
