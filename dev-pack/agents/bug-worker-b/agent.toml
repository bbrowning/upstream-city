# worker-b — Lane B of the bug protocol (N>=2 only).
#
# Identical METHOD to worker-a (it shares worker-a's prompt template), differing
# only in model today: claude/sonnet, to give a genuinely independent second take.
#
# TO ADD A REAL SECOND VENDOR LATER, this is the ONE-LINE change (do it as a
# [[rigs.patches]] on this agent in city.toml so the pack stays project-agnostic):
#     provider = "codex"
#     option_defaults = { model = "gpt-5-codex" }
# plus a [providers.codex] block + creds. The formulas and prompts do NOT change:
# lanes are routed by target and the runtime provider comes from THIS config
# (gc.provider in step metadata is only a dashboard/provenance hint).

scope = "rig"
nudge = "You have a bug lane assignment. Run `gc prime`, read your step bead (it names the TASK and the JSON schema to emit), do the work in your OWN worktree, then finish with emit-json.sh."
idle_timeout = "45m"
min_active_sessions = 0
max_active_sessions = 1
provider = "claude"
option_defaults = { model = "sonnet", effort = "high" }

# Share worker-a's method (DRY). adjustFragmentPath resolves this against the pack
# root. Fallback if a cross-agent prompt reference misbehaves: move the shared
# prompt to assets/prompts/worker.prompt.template.md and point BOTH workers there.
prompt_template = "agents/bug-worker-a/prompt.template.md"

work_dir  = ".gc/worktrees/{{.Rig}}/{{.AgentBase}}"
pre_start = ["{{.CityRoot}}/tools/shared/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}}"]
