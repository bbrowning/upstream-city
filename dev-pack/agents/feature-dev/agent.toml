# Feature-dev — writes code on a real branch, in its own isolated worktree.
#
# The one WRITE lane, deliberately capped at a single slot (max_active_sessions
# = 1) so there is exactly one feature-dev worktree (`feature-dev`) that never
# collides with the N read-only reviewer slots. It does real work: create a
# branch, implement, commit, and hand off a local branch plus immutable HEAD SHA.
# Remote mutation and PR creation are always operator actions outside Gas City.
#
# Division of labor:
#   - prompt.template.md         → the standing METHOD (local branch discipline,
#                                  "never self-close the arc bead").
#   - formulas/feature-dev.toml  → the per-run TASK + the output contract.

scope = "rig"
nudge = "You have a feature assignment. This implementation is local-only: run `gc prime`, read your bead, implement and commit on a local paude/<bead> branch in your worktree, then report the branch, immutable HEAD SHA, worktree state, and tests. Never push, open or modify a PR, fetch as recovery, or otherwise mutate a remote; do NOT close the arc bead yourself."
idle_timeout = "30m"
min_active_sessions = 0
max_active_sessions = 1

# Single-slot worktree isolation. max_active_sessions = 1 (no namepool, no
# min/scale override) does NOT expand into numbered instances, so this resolves
# to one stable slot named "feature-dev" at .gc/worktrees/<rig>/feature-dev.
work_dir = ".gc/worktrees/{{.Rig}}/{{.AgentBase}}"
# The setup script is the SHARED spine copy at the CITY ROOT (tools/shared/), so
# {{.CityRoot}} is correct here — it lives at the city root, not in this pack.
pre_start = ["{{.CityRoot}}/tools/shared/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}}"]
