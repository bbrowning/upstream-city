# Runner — the human-approved dynamic-check lane.
#
# The ONLY identity that runs code from a `limited` PR, and only after a human
# slings the `pr-review-dynamic` formula with an explicit bounded `plan_json`. It
# does NOT judge the code, choose commands, or decide whether running is allowed —
# assets/scripts/run-dynamic-verification.sh delegates each approved command to
# run-scoped-check.sh, which re-derives the
# deterministic ceiling (`--min-ceiling limited`) and refuses if it dropped to
# `restricted`/`block`. The human sling is the EXEC token; the script is the floor.
#
# Rig-scoped, single slot, on-demand: a session spins up when a `pr-review-dynamic`
# step is routed to it and idles out afterward. Execution needs a prepared
# interpreter in $GC_PR_TEST_VENV (for vLLM, built by //tools/vllm/vllm-testenv.sh
# and wired via this rig's [[rigs.patches]] env); absent that it reports
# could_not_verify.
#
# Division of labor:
#   - prompt.template.md          → the runner's standing METHOD.
#   - formulas/pr-review-dynamic.toml → the per-run TASK (which PR + approved
#                                    command) + the exact output contract.

scope = "rig"
nudge = "Approved dynamic-check assignment. First run `bash $GC_CITY_PATH/dev-pack/assets/scripts/claim-trigger.sh`; only then run `gc prime` and the authorized gated check, then submit pr-review-dynamic.v1 once through the schema-aware emit-review.py stdin command; it validates, stores, closes, and notifies."
idle_timeout = "30m"
min_active_sessions = 0
max_active_sessions = 1

# Per-slot detached worktree (same isolation as the reviewer; single slot ->
# `runner`). pre_start only creates the worktree; the runner fetches the specific
# PR head itself (it has the per-bead context that pre_start lacks). The setup
# script is the SHARED spine copy at the CITY ROOT (tools/shared/), so {{.CityRoot}}
# is correct here — it lives at the city root, not in this pack.
work_dir  = ".gc/worktrees/{{.Rig}}/{{.AgentBase}}"
pre_start = ["{{.CityRoot}}/tools/shared/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}}"]
