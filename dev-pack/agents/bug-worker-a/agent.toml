# worker-a — Lane A of the bug protocol (claude/opus); the sole lane at N=1.
#
# One WRITE-capable lane, single slot, in its own detached worktree. The lane
# IDENTITY (worker-a) and its default MODEL live here; the per-run TASK (diagnose /
# reconsider / implement / cross-review) and the exact output schema come from the
# formula step's description — the same division of labor as pr-review's reviewer.
#
# On-demand + rig-scoped: a session spins up when a bug step is routed to it
# and idles out afterward.

scope = "rig"
nudge = "You have a bug lane assignment. Run `gc prime`, read your step bead (it names the TASK — diagnose / reconsider / implement / cross-review — and the JSON schema to emit), do the work in your OWN worktree, then finish with emit-json.sh. Any implementation is local-only: commit and report branch + immutable HEAD SHA + worktree state; never push, create or modify a PR, fetch as recovery, or otherwise mutate a remote."
idle_timeout = "45m"
min_active_sessions = 0
max_active_sessions = 1          # single slot => stable AgentBase "bug-worker-a" => stable worktree
provider = "claude"
option_defaults = { model = "opus", effort = "high" }

# --- Per-slot worktree isolation (see pr-review reviewer for the full rationale).
# Without work_dir a rig-scoped session resolves to the rig root; with this each
# single slot gets its own detached worktree. The setup script is the SHARED spine
# copy at the CITY ROOT (tools/shared/), referenced via {{.CityRoot}}.
work_dir  = ".gc/worktrees/{{.Rig}}/{{.AgentBase}}"
pre_start = ["{{.CityRoot}}/tools/shared/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}}"]
