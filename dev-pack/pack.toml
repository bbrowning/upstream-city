# dev-pack — one engineering-workflow pack, three lanes over a shared spine.
#
# PR-review, bug fix, and feature-dev are ONE workflow with different inputs:
#   decompose -> verify claims -> converge -> (optionally) act -> check
# over a per-rig knowledge corpus (personas, injected via $GC_PERSONAS). What
# differs per lane is the entry artifact, the output schema, and a few dials — not
# a separate machine. This pack hosts all three as sibling agents/, formulas/, and
# commands/, discovered by directory convention (agents/ formulas/ orders/
# commands/ template-fragments/), built entirely from native gascity v1.4.0
# mechanics (work_dir + pre_start worktrees, template-fragments, env idiom) — no
# phantom `isolation="worktree"` primitive.
#
# LANES
#
#   review  — a diff/PR -> a structured merge verdict. Posture-gated: a
#             deterministic pre-scan sets a trust ceiling; triage classifies at or
#             below it; the reviewer re-derives the ceiling and bounds its own
#             fetch/execute latitude by it. Read-only EXCEPT one bounded multi-axis
#             plan it may auto-run on a `trusted` PR (via run-dynamic-verification.sh).
#     agents/pr-triage/     deterministic-first posture triage (1 slot).
#     agents/pr-review-synthesizer/   posture-gated review orchestrator/synthesizer
#                           (pr-review-synthesizer-1, pr-review-synthesizer-2), each in its OWN worktree.
#     agents/pr-runner/     human-approved dynamic-check lane (1 slot): runs one
#                           operator-approved bounded plan on a `limited` PR, gated the same.
#     agents/pr-follow-up/  one-shot, read-only follow-up Q&A on an already-reviewed
#                           PR (1 slot): works in the durable worktree `materialize`
#                           creates, not the reviewer's transient per-slot scratch.
#                           No persistent per-PR session — continuity across rounds
#                           comes from a rebuilt Q&A transcript, not agent memory.
#     agents/pr-arbiter/    the review-divergence SETTLE lane (1 slot): when two
#                           reviewer lanes split on a load-bearing finding, it RESOLVES
#                           the crux by file:line evidence (never a vote — base.md #7
#                           applied to the reviewers' claims), read-only in its own
#                           worktree. Shares the review METHOD (the pr-review-settle.v1
#                           task is schema-dispatched there), so any reviewer profile can
#                           arbitrate via `gc dev-pack settle --arbiter <profile>`.
#     agents/pr-chat/       interactive follow-up CHAT on an already-reviewed PR:
#                           `gc dev-pack ask <PR>` with NO question hands your
#                           terminal to a live agent (via `gc session new`) already
#                           cd'd into the PR's durable worktree, verdict + prior Q&A
#                           loaded. NOT pooled — created on demand, one persistent
#                           session PER PR (detach/re-attach), so several run at once
#                           without blocking; may run tests on request; ephemeral
#                           (writes no bead — the session itself is the memory).
#
#   bug     — a symptom/bead -> root cause + fix, over N opinions (the fan-out dial,
#             `--n`). N=1 is a solo lane that self-verifies its keystones;
#             N>=2 fans out distinct independent worker identities that act as
#             each other's second opinion ("consider or refute — not a mandate") until
#             root cause, then fix, converge (coordinator-judged, with the
#             correlated-convergence gate); the stronger lane implements + tests, the
#             shared reviewer profiles review the immutable artifact and evidence.
#     agents/bug-worker-{a,b}-<profile>/ semantic A/B leaves: diagnose /
#                           reconsider / implement, each single-slot with its own
#                           detached worktree. They share assets/prompts/bug-worker.
#     agents/bug-coordinator/ the synthesis/judge driver (1 slot): reads the N lanes,
#                           runs the self-verify pass (N=1) or the convergence call +
#                           second-opinion relay (N>=2), enforces the per-phase cap,
#                           escalates to the human.
#
#   feature — an intent/bead -> an implementation + tests on a paude/<bead> branch,
#             committed locally. The local branch + immutable HEAD SHA + worktree
#             state are the durable output; export/publication are operator actions.
#     agents/feature-dev-<profile>/ semantic write leaves (1 slot each), sharing
#                           assets/prompts/feature-dev; each uses its own worktree,
#                           real local branch, and coherent commits.
#
# FORMULAS (compile-time DAGs; lanes stay separate formulas that share the spine)
#     formulas/pr-review.toml         N=1 review: triage -> review + pr-review.v1 verdict.
#     formulas/pr-review-quorum.toml  N>=2 review: triage -> N reviewer lanes ->
#                                     synthesis + pr-review-quorum.v1 (superset verdict).
#                                     Synthesis MARKS a load-bearing divergence + the crux;
#                                     with enable_settle=true it auto-slings the settle
#                                     round (default false = report-only, Phase 1).
#     formulas/pr-review-settle.toml  the divergence SETTLE round: a verify-mandated
#                                     arbiter resolves the disputed finding by file:line
#                                     evidence -> pr-review-settle.v1, then a re-synthesis
#                                     folds the resolutions into the final quorum verdict.
#     formulas/pr-review-dynamic.toml human-slung approval lane: run one approved
#                                     bounded plan + pr-review-dynamic.v1 contract.
#     formulas/pr-followup.toml       per-question follow-up: one answer +
#                                     pr-followup.v1 contract, chained to the root
#                                     verdict bead via gc.followup_of.
#     formulas/feature-dev.toml       per-run implement task + feature-dev.v2/local-change.v1 report.
#     formulas/change-lifecycle.toml  shared N=2 immutable review -> settle -> revise/approve.
#     formulas/change-lifecycle-solo.toml N=1 shape of the same bounded lifecycle.
#     formulas/hard-bug-round.toml    N>=2 round: the lanes + a coordinator reconcile
#                                     fan-in. Re-slung per round.
#     formulas/hard-bug-round-solo.toml N=1 round: one lane + a coordinator self-verify
#                                     synthesis. Re-slung per round.
#     formulas/hard-bug-finalize.toml implement -> shared lifecycle handoff.
#     orders/fetch-origin.toml        read-only `git fetch --prune` on a cooldown.
#
# COMMANDS (namespaced: `gc dev-pack <cmd>`)
#     review <PR>       start a PR review (--n 1 single reviewer, --n 2 quorum).
#     bug <bead>        start a bug run (--n 1 solo, --n 2 two-opinion; resolves rig).
#     feature <bead>    start a feature implementation.
#     materialize <PR>  check a PR out into a DURABLE, human-owned worktree (outside
#                       .gc/, never reaped) so a person can read/diff/run it.
#     settle <PR|bead>  resolve a DIVERGED quorum by evidence: a verify-mandated arbiter
#                       settles the disputed finding (file:line, never a vote) + re-synthesizes.
#     summary <bead|PR> re-render a stored pr-review / dynamic-check / settle verdict, LLM-free.
#     ask <bead|PR> ["<question>"]  follow up in the PR's real code (via materialize).
#                       WITH a question: a one-shot agent answers and mails it back,
#                       threaded; each round sees every prior round on the PR. WITHOUT
#                       a question: drops you into a live interactive chat session on
#                       the PR (one persistent chat per PR; `gc session attach`-able).
#     status <bead>     render a bug arc's durable state (phase/round/status).
#
# SHARED SPINE
#     template-fragments/trigger-claim   first-action exact GC_TRIGGER_BEAD_ID
#                                         validation + claim + provenance repair for
#                                         every pooled lane; never discovers substitutes.
#     template-fragments/recovery-header  `gc prime` recovery note (every prompt).
#     template-fragments/worktree-guard   "you are in your own worktree; abort in the
#                                         rig root" guard (every prompt).
#     template-fragments/persona-load     load base.md + the personas whose
#                                         `Activates on:` matches the lane's entry
#                                         using explicit diagnosis, design,
#                                         implementation, change-review, and settle
#                                         lifecycle lenses. Domain facts remain in one
#                                         corpus; the lens controls activation guidance.
#     assets/scripts/emit-verdict.sh      review lane atomic finish (write output_json +
#                                         close + notify $GC_PR_NOTIFY_TO).
#     assets/scripts/emit-json.sh         schema-agnostic atomic finish (bug lane).
#     assets/scripts/dispatch-guard.sh    trigger/output fence + city-wide per-bead
#                                         writer lock shared by all emitters.
#     assets/scripts/pr-prescan.sh        deterministic, injection-proof posture ceiling.
#     assets/scripts/posture-latitude.sh  pure posture -> FETCH/EXEC/GATE table.
#     assets/scripts/run-scoped-check.sh  the deterministic EXEC gate (re-derives the
#                                         ceiling, enforces command form + scope).
#     assets/scripts/run-dynamic-verification.sh aggregate 2-axis + 1-follow-up budget;
#                                         delegates every command to the scoped gate.
#     assets/scripts/render-verdict.sh    verdict -> human-readable summary.
#     assets/scripts/fetch-origin.sh      the fetch order's exec body.
#     //tools/shared/worktree-setup.sh    pre_start hook (SHARED spine — one copy at
#                                         the city root, via {{.CityRoot}}): one
#                                         detached worktree + .beads redirect per slot;
#                                         refuses to run in the rig root (loud fail).
#
# Project-agnostic: nothing here mentions vLLM. The per-rig knowledge corpus
# ($GC_PERSONAS) and the prepared test venv ($GC_PREPARE_TEST_ENV / $GC_PR_TEST_VENV)
# live OUTSIDE the pack, wired to the rig via [[rigs.patches]] env; the pack only
# CONSUMES them.
#
# Isolation guarantee: a rig-scoped session with an empty work_dir resolves to the
# rig root, so every agent sets work_dir = ".gc/worktrees/{{.Rig}}/{{.AgentBase}}";
# pool expansion makes {{.AgentBase}} distinct per slot, so every slot gets a
# distinct worktree — the paude-container guarantee, natively.
#
# Attached via a rig's `includes` in city.toml (the Rig struct has NO `pack` field);
# all agents are rig-scoped (scope="rig"), so they expand once per rig they're
# attached to (intended: vllm).
#
# NOTE — no [[named_session]] blocks. Every agent EXCEPT pr-chat is a POOL agent
# (min/max_active_sessions), auto-discovered from agents/ and expanded by the scope
# in its own agent.toml; min_active_sessions = 0 makes them on-demand (they
# materialize when work is slung). pr-chat is the one exception: a bare template
# (no pool fields, so never auto-spawned) created on demand by `gc session new
# <rig>/pr-chat` for an interactive `ask <PR>` chat — like the city's `lead`, but
# launched by the command, not reserved via a named_session. gc lint forbids a
# named_session that targets a *pool-controlled* agent; a bare template is fine.

[pack]
name = "dev-pack"
schema = 2
description = "One engineering-workflow pack, three lanes over a shared spine: posture-gated standalone PR/local-ref review, bug diagnosis and feature implementation front ends, and one bounded immutable-artifact review → settle → revise/approve lifecycle (default N=2) shared by feature and hard-bug work. Write lanes are local-only and worktree-isolated; review lanes share one persona corpus via $GC_PERSONAS."
