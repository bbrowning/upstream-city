description = """
Finalize a converged hard-bug arc: the stronger lane implements the agreed fix on a
real local branch (writes tests, runs them, fixes, commits), emits the canonical
immutable artifact, then automatically hands it to the shared bounded
review-settle-revise lifecycle used by feature work.

Slung by the coordinator once the fix phase converges. The implementer is selected
at runtime from the coordinator's stronger_lane call; shared semantic review roles
then inspect the resulting immutable artifact.

The shared lifecycle alone closes the arc at an approved exact-artifact checkpoint,
requests a new commit/artifact revision, or escalates at the configured bound. It never
mutates a remote; export, publication, and merge are operator actions outside Gas City.
"""
formula = "hard-bug-finalize"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.bug_bead]
description = "The bug/arc bead id (holds hard-bug-state.v1, incl. agreed_root_cause). Required."
required = true

[vars.base]
description = "Branch point and merge target for the fix branch."
default = "origin/main"

[vars.branch_prefix]
description = "Prefix for the fix branch; the branch is <branch_prefix><bug_bead>. Empty (the default) means the branch is just the bug-bead id. Override with --var branch_prefix=paude/ to namespace it."
default = ""

[vars.implementer_target]
description = "Agent target that implements (the stronger lane). Required."
required = true

[vars.coordinator_target]
description = "Agent target for the finalize step."
default = "bug-coordinator"

[vars.max_rounds]
description = "Fix-phase cap the coordinator honors if it must re-open the fix."
default = "3"

[vars.enable_loop]
description = "Passed through so a re-opened fix phase keeps driving the loop."
default = "true"

[vars.revision]
description = "Positive local-change artifact revision controlled by the shared lifecycle."
default = "1"

[vars.previous_artifact_id]
description = "Prior local-change artifact id for review-driven revisions."
default = ""

[vars.feedback_bead]
description = "Review/settlement bead that requested this revision."
default = ""

[vars.producing_verdict]
description = "Verdict that requested this revision."
default = ""

[vars.review_n]
description = "Review fan-out for the shared lifecycle."
default = "2"

[vars.max_review_iterations]
description = "Maximum artifact revisions before human escalation."
default = "3"

[vars.review_lane_a_target]
description = "Reviewer profile target for shared lifecycle lane A."
default = "pr-reviewer-a-frontier-xhigh"

[vars.review_lane_b_target]
description = "Reviewer profile target for shared lifecycle lane B."
default = "pr-reviewer-b-frontier-xhigh"

[[steps]]
id = "implement"
title = "Implement the converged fix on local branch {{branch_prefix}}{{bug_bead}}"
description = """
Implement the converged fix for arc `{{bug_bead}}`, working ONLY in your own
worktree. Read the agreed root cause and fix plan from `{{bug_bead}}`'s
hard-bug-state.v1 and the fix-phase lane outputs. Branch off `{{base}}`:
`git switch -c {{branch_prefix}}{{bug_bead}} {{base}}`. Make the smallest change that fully
fixes the ROOT CAUSE; add the planned tests; RUN them (and existing suites covering
the area); fix anything they reveal; commit with a concise imperative subject and one
complete what/why body (message file or one subject plus one body argument; never one
`-m` per wrapped line). Record the full immutable SHA from
`git rev-parse HEAD` and the result of `git status --short`. A clean committed
local branch is successful durable output.

For the initial implementation and every review-driven revision, never add an agent,
model, or bot `Signed-off-by` or otherwise claim human legal certification, even when
repository instructions show sign-off examples. AI assistance may use only a
project-appropriate attribution trailer such as `Assisted-by`, `Generated-by`, or
`Co-authored-by`; attribution is distinct from DCO certification. Preserve valid human
sign-offs, but never invent, copy, or auto-apply a human identity.

Before editing, use the `implementation` lifecycle lens to load `base.md` plus only
personas matching the agreed subsystem and planned paths; reload if the actual path set
expands. Record the load and material reflex influences in `persona_traces`.

This step and every retry are strictly local-only: never push, open or modify a
PR, fetch as a missing-ref fallback, or otherwise mutate a remote. The operator
alone exports or publishes commits. Do NOT close the arc bead.
If the target requires DCO, the handoff must say the approved local artifact is not
DCO-ready: a human publisher must review and extract it without committing, then create
the publication commit with their own configured identity and sign-off.

After committing, run `emit-local-change.sh` with intent `hard_bug`, workflow
`hard-bug-finalize`, this rig and bug bead, the exact base/branch, claimed checks,
and revision lineage `--revision {{revision}} --previous-artifact
{{previous_artifact_id}} --feedback-bead {{feedback_bead}} --verdict
{{producing_verdict}}`. Revision 1 has no predecessor; each later revision names
the prior artifact id plus the feedback bead and verdict that produced it. Embed
the resulting immutable `local-change.v1` verbatim as `local_change` in
`hard-bug-implement.v2`, alongside the compatibility fields `branch`, `head_sha`,
`base`, `worktree_state`, `summary`, `tests`, `files_changed`, and `follow_ups`,
plus `persona_traces`,
then mark the parent arc as awaiting review without closing it:
  bash "$GC_CITY_PATH/dev-pack/assets/scripts/update-work-lifecycle.sh" \
    --bead {{bug_bead}} --intent hard_bug --checkpoint implementation \
    --disposition awaiting_review --iteration <revision> \
    --artifact-id <artifact_id> --head-sha <head_sha> --branch <branch>
then finish:
  bash "$GC_CITY_PATH/dev-pack/assets/scripts/emit-json.sh" --bead <your-step-bead> \\
    --json-file "$out" --schema hard-bug-implement.v2 --outcome pass
Contract failure (rig-root worktree, under-specified, or the fix genuinely fails its
own tests): --outcome fail --failure-class hard --failure-reason "…".
"""
metadata = { "gc.run_target" = "{{implementer_target}}", "gc.output_json_schema" = "hard-bug-implement.v2", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"

[[steps]]
id = "review-handoff"
title = "Hand immutable hard-bug artifact to the shared lifecycle"
needs = ["implement"]
description = """
Read hard-bug-implement.v2 from the implement step, then start the same lifecycle used
by feature work:

  bash "$GC_CITY_PATH/dev-pack/assets/scripts/sling-change-lifecycle.sh" \\
    --rig {{.Rig}} --work-bead {{bug_bead}} --intent hard_bug \\
    --artifact <implement-step-bead> --n {{review_n}} \\
    --max-iterations {{max_review_iterations}} --revision-formula hard-bug-finalize \\
    --revision-target {{implementer_target}} --base {{base}} \\
    --branch-prefix "{{branch_prefix}}" --implementer-target {{implementer_target}} \\
    --coordinator-target {{coordinator_target}} \\
    --lane-a-target {{review_lane_a_target}} --lane-b-target {{review_lane_b_target}}

The helper resolves and pins the canonical artifact's exact immutable SHAs. Emit
change-lifecycle-handoff.v1 and close only this step; never close the bug parent here.
"""
metadata = { "gc.run_target" = "pr-review-synthesizer", "gc.output_json_schema" = "change-lifecycle-handoff.v1", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"
