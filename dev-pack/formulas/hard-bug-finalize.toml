description = """
Finalize a converged hard-bug arc: the stronger lane implements the agreed fix on a
real local branch (writes tests, runs them, fixes, commits), the OTHER lane
cross-reviews the immutable local commit AND its verification evidence, then the
coordinator concludes.

Slung by the coordinator once the fix phase converges. Which lane implements vs
reviews is decided at runtime (implementer_target / reviewer_target) from the
coordinator's stronger_lane call — so both roles are provider-agnostic.

The coordinator's finalize step closes the arc as done on concurrence, or re-enters
the fix phase / escalates on rejection. It never mutates a remote; export,
publication, and merge are operator actions outside Gas City.
"""
formula = "hard-bug-finalize"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.bug_bead]
description = "The bug/arc bead id (holds hard-bug-state.v1, incl. agreed_root_cause). Required."
required = true

[vars.base]
description = "Branch point and merge target for the fix branch."
default = "origin/main"

[vars.branch_prefix]
description = "Prefix for the fix branch; the branch is <branch_prefix><bug_bead>. Empty (the default) means the branch is just the bug-bead id. Override with --var branch_prefix=paude/ to namespace it."
default = ""

[vars.implementer_target]
description = "Agent target that implements (the stronger lane). Required."
required = true

[vars.reviewer_target]
description = "Agent target that cross-reviews (the other lane). Required."
required = true

[vars.coordinator_target]
description = "Agent target for the finalize step."
default = "bug-coordinator"

[vars.max_rounds]
description = "Fix-phase cap the coordinator honors if it must re-open the fix."
default = "3"

[vars.enable_loop]
description = "Passed through so a re-opened fix phase keeps driving the loop."
default = "true"

[[steps]]
id = "implement"
title = "Implement the converged fix on local branch {{branch_prefix}}{{bug_bead}}"
description = """
Implement the converged fix for arc `{{bug_bead}}`, working ONLY in your own
worktree. Read the agreed root cause and fix plan from `{{bug_bead}}`'s
hard-bug-state.v1 and the fix-phase lane outputs. Branch off `{{base}}`:
`git switch -c {{branch_prefix}}{{bug_bead}} {{base}}`. Make the smallest change that fully
fixes the ROOT CAUSE; add the planned tests; RUN them (and existing suites covering
the area); fix anything they reveal; commit. Record the full immutable SHA from
`git rev-parse HEAD` and the result of `git status --short`. A clean committed
local branch is successful durable output.

This step and every retry are strictly local-only: never push, open or modify a
PR, fetch as a missing-ref fallback, or otherwise mutate a remote. The operator
alone exports or publishes commits. Do NOT close the arc bead.

After committing, run `emit-local-change.sh` with intent `hard_bug`, workflow
`hard-bug-finalize`, this rig and bug bead, the exact base/branch, claimed checks,
and revision lineage. Revision 1 has no predecessor; each later revision names
the prior artifact id plus the feedback bead and verdict that produced it. Embed
the resulting immutable `local-change.v1` verbatim as `local_change` in
`hard-bug-implement.v2`, alongside the compatibility fields `branch`, `head_sha`,
`base`, `worktree_state`, `summary`, `tests`, `files_changed`, and `follow_ups`,
then finish:
  bash "$GC_CITY_PATH/dev-pack/assets/scripts/emit-json.sh" --bead <your-step-bead> \\
    --json-file "$out" --schema hard-bug-implement.v2 --outcome pass
Contract failure (rig-root worktree, under-specified, or the fix genuinely fails its
own tests): --outcome fail --failure-class hard --failure-reason "…".
"""
metadata = { "gc.run_target" = "{{implementer_target}}", "gc.output_json_schema" = "hard-bug-implement.v2", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"

[[steps]]
id = "cross-review"
title = "Cross-review the fix and its verification evidence"
needs = ["implement"]
description = """
You are the OTHER lane, cross-reviewing the fix for arc `{{bug_bead}}` — read-only.
Read the implementer's `hard-bug-implement.v2` (walk your `needs` edge), then
validate its embedded artifact with `resolve-local-change.sh --rig <rig>
--artifact <implement-step-bead>`. Your worktree and theirs are linked worktrees
of the SAME repo; review the returned exact `<base_sha>...<head_sha>`. If the
artifact, local ref, repository, or commit is absent
or mismatched, report `blocked`; never contact a remote as fallback. Judge (1)
The resolver includes the explicit guard `git rev-parse <branch> == head_sha`;
do not review if that branch-to-SHA check fails.
whether the diff
actually fixes the agreed ROOT CAUSE with no scope creep or new defects
(`concurs_with_fix`), and (2) whether the claimed tests exist and genuinely assert
the corrected behavior — re-run them if feasible (`concurs_with_evidence`). Verdict:
concur / request_changes / blocked.

Emit `hard-bug-crossreview.v1` to gc.output_json, then finish:
  bash "$GC_CITY_PATH/dev-pack/assets/scripts/emit-json.sh" --bead <your-step-bead> \\
    --json-file "$out" --schema hard-bug-crossreview.v1 --outcome pass
"""
metadata = { "gc.run_target" = "{{reviewer_target}}", "gc.output_json_schema" = "hard-bug-crossreview.v1", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"

[[steps]]
id = "finalize"
title = "Coordinator finalize: conclude or re-open"
needs = ["cross-review"]
description = """
Conclude the hard-bug arc `{{bug_bead}}`. Read the cross-reviewer's
`hard-bug-crossreview.v1` (walk your `needs` edge) and the implementer's
`hard-bug-implement.v2` (see your finalize playbook):

- Concur (verdict=concur AND concurs_with_fix AND concurs_with_evidence) → the arc is
  DONE. Mail the human the branch, fix summary, and evidence; set arc status=done.
  Do NOT merge, publish, or otherwise mutate a remote.
- Reject → if rounds.fix < {{max_rounds}}, re-enter the fix phase (sling hard-bug-round
  phase=fix, relaying the cross-review findings); else escalate (hold=mayor + notify the
  human).

Emit `hard-bug-final.v1` via emit-json.sh and MERGE-update the arc status.
"""
metadata = { "gc.run_target" = "{{coordinator_target}}", "gc.output_json_schema" = "hard-bug-final.v1", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"
