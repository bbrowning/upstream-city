description = """
Human-approved bounded dynamic verification (the Phase-2 approval lane).

When a `pr-review` verdict on a `limited` PR surfaces a scoped `dynamic_request`, a
human APPROVES it by slinging this formula with the exact axis plan:

  gc sling <rig>/pr-runner pr-review-dynamic --formula \\
    --var head_ref=<N> --var base_ref=origin/main \\
    --var plan_json='{"checks":[{"axis":"behavior-x","purpose":"coverage","command":["python","-m","pytest","tests/path/to/test_x.py::test_y","-q"]}]}' \\
    --var reason='approved from PR <N> review verdict' \\
    --title 'dynamic check PR <N>' --json

The `runner` agent fetches the PR head into its own worktree and runs the plan
through `run-dynamic-verification.sh --min-ceiling limited`, which delegates each
command to the deterministic scoped gate, re-derives the injection-proof ceiling,
and REFUSES if it dropped to
`restricted`/`block`. So the human sling is the EXEC token, but the deterministic
floor still applies — an approved command on a now-restricted PR is declined. A
refusal / could-not-verify is a normal, honest outcome (closed `pass`).

Human approval cannot widen the two-coverage-axis plus one-final-follow-up,
600-second, 64-KiB aggregate budget. Single human-slung step, routed by
`gc.run_target` (default `pr-runner`).
"""
formula = "pr-review-dynamic"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.head_ref]
description = "The PR under check: a PR number N (fetched as origin pull/N/head), a branch, or a sha."
default = "HEAD"

[vars.base_ref]
description = "Baseline ref the diff is compared against (used by the ceiling re-scan)."
default = "origin/main"

[vars.command]
description = "Deprecated compatibility form for one approved coverage-axis command. Prefer plan_json."
default = ""

[vars.plan_json]
description = "The exact approved bounded plan: JSON with 1-2 distinct coverage axes and at most one final followup, each command an argv array. Empty falls back to command."
default = ""

[vars.reason]
description = "Provenance for the approval, e.g. 'approved from PR 51296 review bead vllm-957'."
default = ""

[vars.expect_head_sha]
description = "Optional: the head sha the reviewer saw. If set, the gate refuses when HEAD has moved (force-push guard)."
default = ""

[vars.runner_target]
description = "Agent that runs the approved check. Bare name resolves within the rig; override to a rig-qualified name (e.g. vllm/pr-runner) if bare resolution fails."
default = "pr-runner"

[[steps]]
id = "run"
title = "Run one human-approved bounded verification plan through the deterministic gate"
description = """
A human has approved running this exact bounded plan against PR `{{head_ref}}`
(base `{{base_ref}}`):

    plan_json={{plan_json}}
    compatibility_command={{command}}

Reason / provenance: {{reason}}

Do this inside your own isolated worktree (never the rig root). See your runner
method for detail:
1. Sanity-check the worktree (abort → `blocked` if it is the rig root).
2. Fetch the PR head and `git checkout --detach` it (if `{{head_ref}}` is a PR
   number N: `git fetch origin pull/N/head`).
3. Run the approved plan through the gate — it enforces at most two distinct
   coverage axes plus one final follow-up, 600 seconds, and 64 KiB total, and each
   delegated check re-derives the ceiling and every existing safety control:
   `bash "$GC_CITY_PATH/dev-pack/assets/scripts/run-dynamic-verification.sh" --head {{head_ref}} --base {{base_ref}} --min-ceiling limited --plan-json '<exact plan_json>'`.
   If `plan_json` is empty but `command` is not, parse that approved prepared-env
   command without shell evaluation into one `coverage` check named
   `human-approved`; do not add or improve commands.
   If `expect_head_sha` was provided (`{{expect_head_sha}}`), add
   `--expect-head-sha {{expect_head_sha}}` before `--plan-json`. If both
   `plan_json` and `command` are empty, do nothing and report `skipped` with
   `reason_if_skipped="no-plan-provided"`.
4. Interpret the aggregate `dynamic-verification.v1` and every nested
   `scoped-check.v1` honestly — a network/egress failure
   (`network_hint`) or `could_not_verify`/`timeout` is an env limit, not a code
   defect; `skipped` (ceiling-below-required, out-of-scope, bad form, head-moved) is
   a correct refusal.

Write this JSON object (schema `pr-review-dynamic.v1`) to `gc.output_json`:

- `head_ref`, `base_ref`, `head_sha`: what you ran against
- `plan`: the approved plan (verbatim); `command`: the compatibility command or empty
- `approved_reason`: the `{{reason}}` var; `authorized_by`: "human-sling"
- `ceiling_posture`: the fresh ceiling from the gate's re-scan; `min_ceiling`: "limited"
- `ran_checks`: integer; `checks`: axis-tagged scoped results; `budget`: aggregate
  limits/usage; `outcome`: one of `pass`, `fail`, `timeout`, `could_not_verify`, `skipped`
- `git_clean_after`, `mutations_delta`, `reason_if_stopped`: aggregate gate evidence;
  per-check `rc`, `duration_s`, environment, output tail, network hint, skip reason,
  and before/after cleanliness remain verbatim in `checks[]`
- `summary`: 1–3 sentences — what ran, the result, and any honesty note
- `failure_class`: one of `none`, `transient`, `hard`; `failure_reason`: stable string or ""

Finish the step with the single schema-aware `emit-review.py` stdin command (see your runner method):
it writes the JSON to `gc.output_json`, closes the bead, AND notifies the human,
atomically. Use `--outcome pass` for every honest result (including `skipped`,
`could_not_verify`, and a real `fail` — the *check* failed but your *step* did its
job). Use `--outcome fail --failure-class transient` (or `hard`) with a stable
`--failure-reason` ONLY for infrastructure breakage (provider down, repo
unreachable, prescan infra error, worktree misresolved to the rig root). Do not run
a separate `gc bd close` or `gc mail send`.
"""
metadata = { "gc.run_target" = "{{runner_target}}", "gc.output_json_schema" = "pr-review-dynamic.v1", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"
