description = """
One round of the bug protocol at N=1 (a single opinion — the solo dial).

Runs ONE worker lane to diagnose (phase=root_cause) or reconsider (phase=fix) a bug,
then routes a synthesis step to the coordinator, gated on that one lane. This is the
degenerate N=1 shape of hard-bug-round: there is no peer lane, so no second-opinion
relay and no cross-lane convergence — the coordinator's synthesis is a keystone
SELF-VERIFY pass (did the lane ground-truth the load-bearing facts its diagnosis rests
on?) plus the outer-loop decision. B (self-verify keystones) applies at every N; C
(the correlated-convergence gate) exists only at N>=2 and is therefore absent here.

Same schemas and gc.hard_bug_* metadata as hard-bug-round, so status/render/arc-state
all work unchanged (the arena projector keys off those schema IDs + metadata, not the
formula name, and separately no-ops on 1-participant rounds). N>=2 uses hard-bug-round
(two-plus lanes + reconcile); the launch command and the coordinator pick the formula
by the opinion count.

The OUTER loop across rounds and phases is NOT here (a compile-time DAG cannot express
the subjective cross-round loop-back): the coordinator drives it from its prompt by
re-slinging this formula.
"""
formula = "hard-bug-round-solo"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.bug_bead]
description = "The bug/arc bead id under diagnosis (also holds the durable hard-bug-state.v1). Required."
required = true

[vars.base_ref]
description = "Baseline ref the lane reads the code/diff against."
default = "origin/main"

[vars.phase]
description = "root_cause (diagnose) or fix (converge the fix plan)."
default = "root_cause"

[vars.round]
description = "1-based round number within this phase."
default = "1"

[vars.max_rounds]
description = "Per-phase iteration cap; the coordinator escalates when a next round would exceed it."
default = "3"

[vars.enable_loop]
description = "false = report-only (coordinator stops after the synthesis verdict, Stage 1); true = coordinator drives the outer loop (Stage 2+)."
default = "false"

[vars.branch_prefix]
description = "Prefix for the eventual fix branch, forwarded unchanged to hard-bug-finalize when the coordinator advances to implement. Empty (the default) means the branch is just the bug-bead id."
default = ""

[vars.review_n]
description = "Shared post-implementation review fan-out (1 or 2)."
default = "2"
[vars.max_review_iterations]
description = "Shared lifecycle artifact revision cap."
default = "3"
[vars.review_lane_a_target]
description = "Shared lifecycle reviewer profile A."
default = "pr-reviewer-a-frontier-high"
[vars.review_lane_b_target]
description = "Shared lifecycle reviewer profile B."
default = "pr-reviewer-b-frontier-high"

[vars.lane_a_id]
description = "Durable identity for the sole lane (survives slot churn)."
default = "bug-lane-a"
[vars.lane_a_target]
description = "Semantic sole-lane target. Bare names resolve within the rig; a deliberate custom override may be rig-qualified (for example, vllm/bug-worker-a-frontier-medium)."
default = "bug-worker-a-frontier-high"
[vars.coordinator_target]
description = "Agent target for the synthesis (reconcile) step."
default = "bug-coordinator"

[[steps]]
id = "lane-a"
title = "Lane {{lane_a_id}}: {{phase}} (round {{round}})"
description = """
You are lane `{{lane_a_id}}`, the SOLE lane on this bug at N=1, working ONLY in your
own worktree. Bug/arc bead: `{{bug_bead}}` (`gc bd show {{bug_bead}} --json`); if it
links an upstream GitHub issue (external ref / URL), fetch it too:
`gh issue view <issue-url> --comments`.
Baseline ref for reading code: `{{base_ref}}`. Phase: `{{phase}}`. Round: `{{round}}`.

There is no peer lane at N=1 — no second opinion to weigh. Your diagnosis stands on
its own evidence, so grounding your keystones is your ONLY guard against a confident
wrong answer: the coordinator's synthesis will check it.

Task by phase (see your worker method for the full playbook):
- root_cause: find the ROOT CAUSE and its mechanism (not a symptom); back it with
  concrete evidence (files, lines, repro, traces); sketch a fix. Ground-truth the
  keystones your diagnosis rests on — load-bearing facts (token ids, special/EOS
  tokens, config defaults — fetch the tokenizer/config, don't infer) AND causal steps
  in the mechanism; list them in `keystone_facts` and cap confidence at `medium` for
  any you could not verify (hedge an unconfirmed mechanism, don't assert it boldly).
- fix: the root cause is already agreed (read `agreed_root_cause` from `{{bug_bead}}`'s
  hard-bug-state.v1); converge the concrete FIX — the change, tests_to_add, and
  verification_plan.

Emit `hard-bug-diagnosis.v1` to gc.output_json, then finish:
  bash "$GC_CITY_PATH/dev-pack/assets/scripts/emit-json.sh" --bead <your-step-bead> \\
    --json-file "$out" --schema hard-bug-diagnosis.v1 --outcome pass
On a retryable infra failure: --outcome fail --failure-class transient --failure-reason "…".
"""
metadata = { "gc.run_target" = "{{lane_a_target}}", "gc.hard_bug_lane" = "{{lane_a_id}}", "gc.hard_bug_phase" = "{{phase}}", "gc.hard_bug_round" = "{{round}}", "gc.output_json_schema" = "hard-bug-diagnosis.v1", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 2
on_exhausted = "soft_fail"

[[steps]]
id = "reconcile"
title = "Coordinator synthesis (N=1): {{phase}} round {{round}}"
needs = ["lane-a"]
description = """
Synthesize phase `{{phase}}` round `{{round}}` of the bug arc `{{bug_bead}}` at N=1
(one lane — the solo/degenerate path). Read the sole lane's `gc.output_json` (walk
your `needs` edge, or the shared gc.root_bead_id filtered to schema
hard-bug-diagnosis.v1):
`gc bd show <lane-bead> --json | jq -r '.[0].metadata["gc.output_json"]'`.

There is no second lane, so there is nothing to reconcile and no correlated-convergence
gate. Instead run the N=1 SELF-VERIFY synthesis (see your coordinator protocol): confirm
the lane ground-truthed the keystones its diagnosis rests on — every `keystone_facts`
entry is `verified`, or `could_not_verify` only for a genuinely expensive fact with the
confidence capped and the mechanism hedged (not a skipped cheap lookup). Then emit
`hard-bug-reconcile.v1` (aligned=true, divergences=[], stronger_lane=<the sole lane>,
unverified keystones carried as action=caveat) via emit-json.sh, and MERGE-update
`{{bug_bead}}`'s hard-bug-state.v1 (bump rounds.{{phase}}, set last_reconcile, and —
when root cause is verified — record agreed_root_cause).

Then act on the outer loop per your protocol, using THESE run vars:
  bug_bead={{bug_bead}} phase={{phase}} round={{round}} max_rounds={{max_rounds}}
  enable_loop={{enable_loop}} base_ref={{base_ref}} branch_prefix={{branch_prefix}}
  review_n={{review_n}} max_review_iterations={{max_review_iterations}}
  review profiles: A={{review_lane_a_target}} B={{review_lane_b_target}}
  lane_a: id={{lane_a_id}} target={{lane_a_target}}
  coordinator_target={{coordinator_target}}

- enable_loop=false (Stage 1): after emitting the synthesis verdict, mail the human a
  summary and STOP — do not launch another round.
- enable_loop=true: advance root_cause->fix (re-sling hard-bug-round-solo phase=fix) /
  choose the sole lane as implementer and sling hard-bug-finalize, preserving every
  review var above / escalate
  to the human when a cheap keystone is unverified and cannot be self-resolved, or a next
  round would exceed {{max_rounds}}. (There is no relay_next_round at N=1: with one lane
  there is no peer to relay and no divergence to resolve by another round.)
"""
metadata = { "gc.run_target" = "{{coordinator_target}}", "gc.hard_bug_phase" = "{{phase}}", "gc.hard_bug_round" = "{{round}}", "gc.output_json_schema" = "hard-bug-reconcile.v1", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"
