description = """
Single-lane feature implementation.

Routes one write assignment to the feature-dev agent, which implements it on a
real `paude/<bead_id>` branch inside its own isolated worktree, pushes to origin,
and emits a structured report to `gc.output_json`. The push is the durable
output; opening/merging the PR is a separate, human- or checkpoint-gated step.

Deliberately the minimal shape and a single lane (feature-dev is capped at one
pool slot), so it never collides with the read-only reviewers. The arc/tracking
bead is NOT closed by this formula — it closes on a real checkpoint (PR opened,
CI green, merged).
"""
formula = "feature-dev"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.bead_id]
description = "The assignment/tracking bead id. The branch is named paude/<bead_id>. Required — there is no safe default for a branch name."

[vars.base]
description = "The branch point and merge target the feature branches from."
default = "origin/main"

[[steps]]
id = "implement"
title = "Implement the assignment on a paude/<bead_id> branch and push"
description = """
Implement the assignment described in your bead, working **only inside your own
isolated worktree** (created for your slot before this session). Do not work in
the shared rig root.

Method (see your feature-dev prompt for detail):
- `git fetch origin`, then `git switch -c paude/{{bead_id}} {{base}}` — one
  branch per assignment, branched off the merge target.
- Make the smallest change that fully does the job; keep unrelated edits out.
- Build and run the relevant tests in your worktree; record the exact commands
  and results. Do not imply a check passed that you did not run.
- Commit in coherent steps, then **push**: `git push -u origin paude/{{bead_id}}`.
  The push is the point of no return and the durable output of this step.
- Open the PR only if this assignment says to; otherwise report the branch.

Do **not** close the arc/tracking bead — that closes on a real checkpoint, not
your self-report.

Write this JSON object to `gc.output_json`:

- `branch`: the branch you pushed (e.g. `paude/{{bead_id}}`)
- `pushed`: boolean — true only if `git push` succeeded
- `head_sha`: the sha you pushed
- `base`: the base you branched from ({{base}})
- `pr_url`: the PR URL if you opened one, else null
- `summary`: 1–3 sentences on what changed and why
- `tests`: array of `{command, result}` for checks you actually ran
- `files_changed`: array of paths
- `follow_ups`: anything a reviewer or human should know (or [])
- `failure_class`: one of `none`, `transient`, `hard`
- `failure_reason`: stable reason string, or "" when `none`

On success, close with `gc.outcome=pass` and the JSON in `gc.output_json`. On a
retryable infra failure (provider down, repo unreachable, push rejected for
auth) close with `gc.outcome=fail`, `gc.failure_class=transient`, and a stable
`gc.failure_reason`. Use `gc.failure_class=hard` for non-retryable contract/input
failures (under-specified assignment, or `pwd` resolved to the rig root).
"""
metadata = { "gc.output_json_schema" = "feature-dev.v1", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"
