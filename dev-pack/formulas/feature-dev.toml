description = """
Single-lane feature implementation.

Routes one write assignment to the feature-dev agent, which implements it on a
real `paude/<work_bead>` branch inside its own isolated worktree and emits a
structured report to `gc.output_json`. A coherent committed local
branch, immutable HEAD SHA, and explicit worktree state are the durable output.
Exporting commits or creating a PR is an operator action outside Gas City.

Deliberately the minimal shape and a single lane (feature-dev is capped at one
pool slot), so it never collides with the read-only reviewers. The arc/tracking
bead is NOT closed by this formula — it closes on a real operator checkpoint.
"""
formula = "feature-dev"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.work_bead]
description = "The assignment/tracking bead id. The branch is named paude/<work-bead>. Required — there is no safe default for a branch name."
required = true

[vars.base]
description = "The branch point and merge target the feature branches from."
default = "origin/main"

[vars.fetch_base]
description = "true fetches a remote-qualified base ref narrowly before resolving it; false is offline and records freshness as unverified."
default = "true"

[vars.revision]
description = "Positive local-change artifact revision controlled by the lifecycle."
default = "1"

[vars.previous_artifact_id]
description = "Prior local-change artifact id; required by the emitter when revision is greater than 1."
default = ""

[vars.feedback_bead]
description = "Review or synthesis bead whose verdict produced this revision."
default = ""

[vars.producing_verdict]
description = "Structured verdict that produced this revision."
default = ""

[vars.review_n]
description = "Review fan-out for the shared lifecycle (1 or 2)."
default = "2"

[vars.max_review_iterations]
description = "Maximum implementation/artifact revisions before human escalation."
default = "3"

[vars.implementer_target]
description = "Semantic feature leaf selected by the execution profile; preserved for every revision."
required = true

[vars.review_lane_a_target]
description = "Reviewer profile target for lifecycle lane A."
default = "pr-reviewer-sonnet-xhigh"

[vars.review_lane_b_target]
description = "Reviewer profile target for lifecycle lane B (unused at N=1)."
default = "pr-reviewer-gpt56luna-xhigh"

[[steps]]
id = "implement"
title = "Implement the assignment on a local paude/{{work_bead}} branch"
description = """
Implement the assignment described in your bead, working **only inside your own
isolated worktree** (created for your slot before this session). Do not work in
the shared rig root.

Method (see your feature-dev prompt for detail):
- With `fetch_base={{fetch_base}}`: when true, require `{{base}}` to be a
  remote-qualified `<remote>/<branch>`, record `git remote get-url <remote>`, and
  narrowly refresh only that branch with `git fetch --no-tags <remote>
  +refs/heads/<branch>:refs/remotes/<remote>/<branch>`. This is read-only with
  respect to the remote. When false, contact no remote and record base freshness
  as unverified. Resolve the requested `{{base}}` verbatim, then
  `git switch -c paude/{{work_bead}} {{base}}` — one branch per assignment.
- Before design or editing, load base plus only path/subsystem-matched personas through
  the `design` lens; reload through `implementation` when the actual path set is known.
- Make the smallest change that fully does the job; keep unrelated edits out.
- Build and run the relevant tests in your worktree; record the exact commands
  and results. Do not imply a check passed that you did not run.
- Commit in coherent steps with an imperative subject and a single complete what/why
  body. Use a message file or one subject plus one body argument, never one `-m` per
  wrapped line. Verify the local handoff with `git rev-parse HEAD`
  and `git status --short`.
- This is strictly local-only: never push, open or modify a PR, or otherwise
  mutate a remote. The single selected-base fetch above is the only permitted
  network read. Operators alone export
  commits and decide whether or where to publish them.

Do **not** close the arc/tracking bead — that closes on a real checkpoint, not
your self-report.

After committing, create the canonical artifact with `emit-local-change.sh`
(`--intent feature --workflow feature-dev --bead {{work_bead}} --revision {{revision}}`,
plus this rig, requested base ref verbatim, branch, JSON checks, and revision
lineage `{{previous_artifact_id}}` / `{{feedback_bead}}` / `{{producing_verdict}}`).
Pass `--base-fetch-status fetched` plus the recorded remote URL and fetched ref
when `fetch_base=true`; otherwise pass `--base-fetch-status offline`.
Before closing the implementation step, durably mark the still-open parent work
as awaiting review (never close it here):
  bash "$GC_CITY_PATH/dev-pack/assets/scripts/update-work-lifecycle.sh" \
    --bead {{work_bead}} --intent feature --checkpoint implementation \
    --disposition awaiting_review --iteration {{revision}} \
    --artifact-id <artifact_id> --head-sha <head_sha> --branch <branch>
Embed its JSON verbatim as `local_change` in this `feature-dev.v2` object, then
finish atomically with `emit-json.sh` (schema `feature-dev.v2`).

Write this JSON object to `gc.output_json`:

- `branch`: the local branch (e.g. `paude/{{work_bead}}`)
- `head_sha`: the full immutable SHA from `git rev-parse HEAD`
- `base`: the base you branched from ({{base}})
- `worktree_state`: `clean` or `dirty`; explain residual paths in `follow_ups`
- `summary`: 1–3 sentences on what changed and why
- `tests`: array of `{command, result}` for checks you actually ran
- `files_changed`: array of paths
- `follow_ups`: anything a reviewer or human should know (or [])
- `failure_class`: one of `none`, `transient`, `hard`
- `failure_reason`: stable reason string, or "" when `none`
- `local_change`: the complete immutable `local-change.v1` artifact. Its resolved
  base/head SHAs, repository identity, commit/path inventories, verification,
  provenance, and revision lineage are authoritative for downstream review.
- `persona_traces`: the design and implementation lens load/influence records.

On success, close with `gc.outcome=pass` and the JSON in `gc.output_json`. On a
successful implementation, the same `emit-json.sh` call must include
`--work-outcome shipped --work-commit <head_sha> --work-branch <branch>` so the
work record and durable output close together. On a
retryable infra failure (provider down) close with `gc.outcome=fail`,
`gc.failure_class=transient`, and a stable
`gc.failure_reason`. Use `gc.failure_class=hard` for non-retryable contract/input
failures (under-specified assignment, absent local base ref, or `pwd` resolved
to the rig root). Retries must remain local-only.
"""
metadata = { "gc.output_json_schema" = "feature-dev.v2", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"

[[steps]]
id = "review-handoff"
title = "Hand immutable feature artifact to the shared lifecycle"
needs = ["implement"]
description = """
Read the implement step's feature-dev.v2 output and pass its implementation bead to
sling-change-lifecycle.sh. The helper independently resolves local-change.v1, pins its
exact base/head SHAs and provenance, and starts N={{review_n}} review (default N=2):

  bash "$GC_CITY_PATH/dev-pack/assets/scripts/sling-change-lifecycle.sh" \
    --rig {{.Rig}} --work-bead {{work_bead}} --intent feature \
    --artifact <implement-step-bead> --n {{review_n}} \
    --max-iterations {{max_review_iterations}} --revision-formula feature-dev \
    --revision-target {{implementer_target}} --base {{base}} \
    --lane-a-target {{review_lane_a_target}} --lane-b-target {{review_lane_b_target}}

This handoff and every later revision are local-only. Emit
change-lifecycle-handoff.v1 with work_bead, intent_kind, artifact_ref, revision,
review_n, lifecycle_formula, and failure fields, then close this step with emit-json.sh.
Do not close the parent work bead.
"""
metadata = { "gc.run_target" = "pr-review-synthesizer", "gc.output_json_schema" = "change-lifecycle-handoff.v1", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"
